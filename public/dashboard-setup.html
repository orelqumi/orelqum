<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Owner Account Setup | Orelqumi Technologies</title><link rel="stylesheet" href="assets/portal.css">  <link rel="stylesheet" href="assets/portal-responsive.css?v=20261113">
</head><body class="portal-body"><header class="portal-header"><a class="portal-brand" href="index.html"><img src="assets/logo.svg" alt=""><span>ORELQUMI<small>TECHNOLOGIES</small></span></a></header><main class="portal-access"><div class="portal-access-card"><span class="portal-eyebrow">ONE-TIME OWNER SETUP</span><h1>Create the administrator account.</h1><p>Use the private setup code stored in Cloudflare under <code>ORELQUMI_SETUP_KEY</code>. This can only create the first administrator.</p><form id="setup-form" class="portal-form"><div class="portal-field"><label>Owner name</label><input name="name" required minlength="2" autocomplete="name"></div><div class="portal-field"><label>Owner email</label><input name="email" type="email" required autocomplete="email"></div><div class="portal-field"><label>Strong password (12 characters minimum)</label><input name="password" type="password" minlength="12" required autocomplete="new-password"></div><div class="portal-field"><label>Private setup code</label><input name="setup_key" type="password" required></div><button type="submit" class="portal-button">Create owner account →</button></form><div id="login-message" role="status" aria-live="polite" hidden></div><p class="portal-help">After setup, remove <code>ORELQUMI_SETUP_KEY</code> from Cloudflare to reduce exposure.</p></div></main><script src="assets/portal.js"></script></body></html>
